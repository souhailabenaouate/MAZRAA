<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" role="img" aria-label="Gharss, the Mazra'a assistant">
  <defs>
    <clipPath id="garss-bg"><circle cx="120" cy="120" r="120"/></clipPath>
  </defs>
  <g clip-path="url(#garss-bg)">
    <circle cx="120" cy="120" r="120" fill="#FBF7F1"/>

    <!-- orbit arc -->
    <path d="M36 154C18 74 84 22 166 34" fill="none" stroke="#6F8B6B" stroke-width="5" stroke-linecap="round"/>

    <!-- straw hat -->
    <ellipse cx="112" cy="64" rx="63" ry="17" fill="#D9AE7C" transform="rotate(-5 112 64)"/>
    <path d="M70 64C72 34 88 20 112 20s40 14 42 44z" fill="#E8C89B"/>
    <path d="M71 56c20 10 60 10 82 0l1 10c-22 10-62 10-84 0z" fill="#6E4529"/>
    <g>
      <path d="M80 46c-10-4-15-13-12-23 8 7 13 14 12 23z" fill="#5F7A52"/>
      <path d="M89 42c1-11 9-18 20-19 0 11-8 18-20 19z" fill="#7C9375"/>
      <path d="M82 48c-3-7-3-14 0-21" fill="none" stroke="#5C775C" stroke-width="2.8" stroke-linecap="round"/>
    </g>

    <!-- head -->
    <rect x="62" y="68" width="108" height="80" rx="36" fill="#F3E3CB"/>
    <rect x="78" y="80" width="76" height="56" rx="24" fill="#4A2E1E"/>
    <g fill="none" stroke="#F3E3CB" stroke-width="4.6" stroke-linecap="round">
      <path d="M94 106c4-7 10-7 14 0"/>
      <path d="M124 106c4-7 10-7 14 0"/>
      <path d="M108 120c5 4 11 4 16 0"/>
    </g>

    <!-- headphones -->
    <ellipse cx="60" cy="114" rx="15" ry="20" fill="#E4D2B8"/>
    <ellipse cx="60" cy="114" rx="9" ry="13" fill="#7C9375"/>
    <ellipse cx="172" cy="114" rx="15" ry="20" fill="#E4D2B8"/>
    <ellipse cx="172" cy="114" rx="9" ry="13" fill="#7C9375"/>

    <!-- speech bubble -->
    <g>
      <path d="M196 60h20c9 0 16 7 16 16v16c0 9-7 16-16 16h-20l-13 12v-12h-3c-9 0-16-7-16-16V76c0-9 7-16 16-16z" fill="#6E8464"/>
      <g fill="#FBF7F1">
        <circle cx="190" cy="84" r="3.8"/>
        <circle cx="202" cy="84" r="3.8"/>
        <circle cx="214" cy="84" r="3.8"/>
      </g>
      <g stroke="#6E8464" stroke-width="6" stroke-linecap="round">
        <path d="M212 46l3-12"/>
        <path d="M226 50l5-11"/>
      </g>
    </g>

    <!-- body -->
    <path d="M76 178c2-26 18-38 42-38s40 12 42 38z" fill="#F3E3CB"/>
    <path d="M92 178c2-16 12-24 26-24s24 8 26 24z" fill="#EAD8BE"/>
    <g stroke="#6E4529" stroke-width="5" fill="none" stroke-linecap="round" opacity=".5">
      <path d="M96 150c-4 9-5 18-4 28M140 150c4 9 5 18 4 28"/>
    </g>
    <path d="M118 152c-8 0-14 5-16 12 8 1 14-3 16-12z" fill="#7C9375"/>
    <path d="M119 152c1-8 7-13 15-14-1 8-6 13-15 14z" fill="#93A78C"/>

    <!-- waving arm -->
    <path d="M150 172c8-10 14-20 18-30" fill="none" stroke="#F3E3CB" stroke-width="16" stroke-linecap="round"/>
    <ellipse cx="174" cy="132" rx="13" ry="11" fill="#F3E3CB" transform="rotate(-18 174 132)"/>
    <path d="M166 128c4-4 8-4 11 0" fill="none" stroke="#DCC7AC" stroke-width="3" stroke-linecap="round"/>

    <!-- leaves, bottom left -->
    <g>
      <path d="M44 210c-8-26-2-48 16-62 6 26-2 48-16 62z" fill="#7C9375"/>
      <path d="M64 214c4-24 18-40 40-44-6 24-20 38-40 44z" fill="#93A78C"/>
      <path d="M50 214c2-12 2-22 0-30" fill="none" stroke="#5C775C" stroke-width="3.4" stroke-linecap="round"/>
    </g>

    <!-- field bands -->
    <path d="M34 222c22-22 50-34 82-36l10 12c-30 6-58 16-88 28z" fill="#7C9375" stroke="#FBF7F1" stroke-width="3" stroke-linejoin="round"/>
    <path d="M74 224c20-20 48-30 80-32l10 12c-30 4-58 12-86 24z" fill="#697F55" stroke="#FBF7F1" stroke-width="3" stroke-linejoin="round"/>
    <path d="M118 226c20-16 44-24 72-24l12 10c-28 2-54 8-80 18z" fill="#8B5B37" stroke="#FBF7F1" stroke-width="3" stroke-linejoin="round"/>
  </g>
</svg>
